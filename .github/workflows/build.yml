name: Build MT7902
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Liberar espaco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Dependencias
        run: sudo apt-get update -y && sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev dwarves git xz-utils wget zstd kmod

      - name: Preparar kernel (sem build completo)
        run: |
          KVER=6.18.16
          W=$HOME/mt7902-build; mkdir -p $W; cd $W
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz
          tar xf linux-$KVER.tar.xz
          wget -qO linux-$KVER/.config https://raw.githubusercontent.com/batocera-linux/batocera.linux/master/board/batocera/x86/linux_x86_64-defconfig.config
          cd linux-$KVER
          make olddefconfig
          scripts/config -d DEBUG_INFO_BTF -d DEBUG_INFO_DWARF4 -d DEBUG_INFO_DWARF5 -e DEBUG_INFO_NONE || true
          make olddefconfig
          grep -E "^CONFIG_(MODVERSIONS|MODULE_SIG|LOCALVERSION|PREEMPT_DYNAMIC|MAC80211|CFG80211)" .config || true

          # so prepara a infraestrutura de build de modulos, nao compila o kernel inteiro
          make -j$(nproc) modules_prepare

          # injeta os CRCs reais extraidos do Batocera em execucao (crcs.txt do repo)
          test -f "$GITHUB_WORKSPACE/crcs.txt" || { echo "crcs.txt nao encontrado no repo"; exit 1; }
          # formato exigido pelo modpost do 6.18: crc<TAB>simbolo<TAB>modulo<TAB>tipo<TAB>namespace (5 campos; namespace vazio, mas o TAB final e obrigatorio)
          awk 'NF>=2 { c=$1; if (c !~ /^0x/) c="0x" c; printf "%s\t%s\tvmlinux\tEXPORT_SYMBOL\t\n", c, $2 }' "$GITHUB_WORKSPACE/crcs.txt" > Module.symvers
          wc -l Module.symvers
          head -3 Module.symvers | cat -A
          BAD=$(awk -F'\t' 'NF!=5' Module.symvers | wc -l)
          echo "linhas invalidas no Module.symvers: $BAD"
          test "$BAD" = "0" || { echo "Module.symvers com formato invalido"; exit 1; }

      - name: Compilar driver mt7902
        run: |
          KVER=6.18.16
          W=$HOME/mt7902-build; cd $W
          git clone --depth 1 -b backport https://github.com/hmtheboy154/mt7902
          cd mt7902
          make KSRC=$W/linux-$KVER KVER=$KVER
          mkdir -p $W/pack/modules $W/pack/firmware/mediatek
          cp *.ko $W/pack/modules/
          cp firmware/*.bin $W/pack/firmware/mediatek/
          cd $W && tar cf mt7902-pack.tar -C pack .
          echo "=== RESULTADO ==="; tar tf mt7902-pack.tar
          for f in pack/modules/*.ko; do echo "$f"; modinfo -F vermagic $f; modinfo -F depends $f; done
          mkdir -p $GITHUB_WORKSPACE/out && cp mt7902-pack.tar $GITHUB_WORKSPACE/out/

      - uses: actions/upload-artifact@v4
        with:
          name: mt7902-pack
          path: out/mt7902-pack.tar

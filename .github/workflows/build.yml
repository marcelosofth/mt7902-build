name: Build MT7902
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Liberar espaco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Dependencias
        run: sudo apt-get update -y && sudo apt-get install -y build-essential bc bison flex libelf-dev libssl-dev dwarves git xz-utils wget zstd kmod
      - name: Compilar
        run: |
          set -e
          KVER=6.18.16
          W=$HOME/mt7902-build; mkdir -p $W; cd $W
          # config e patches do Batocera 43 (NAO usar master: la o kernel ja e 7.x)
          OK=""
          for ref in 43 v43 43.1 v43.1; do
            rm -rf bat
            if git clone --depth 1 --filter=blob:none --no-checkout -b $ref https://github.com/batocera-linux/batocera.linux bat 2>/dev/null; then
              OK=$ref; break
            fi
          done
          if [ -z "$OK" ]; then
            echo "ERRO: nao achei o branch/tag do Batocera 43. Opcoes existentes:"
            git ls-remote --heads --tags https://github.com/batocera-linux/batocera.linux | grep -E "refs/(heads|tags)/v?4[0-9]" || true
            exit 1
          fi
          echo "Usando ref: $OK"
          cd bat
          git sparse-checkout set board/batocera/x86 configs
          git checkout
          grep -h "KERNEL_CUSTOM_VERSION_VALUE" configs/*x86_64*.board || true
          cd $W
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-$KVER.tar.xz
          tar xf linux-$KVER.tar.xz
          cd linux-$KVER
          for p in $(find $W/bat/board/batocera/x86/linux_patches -type f \( -name '*.patch' -o -name '*.diff' \) | sort); do
            echo "patch: $p"
            patch -p1 --no-backup-if-mismatch < $p
          done
          cp $W/bat/board/batocera/x86/linux_x86_64-defconfig.config .config
          make olddefconfig
          grep -E "^CONFIG_(MODVERSIONS|MODULE_SIG|LOCALVERSION|PREEMPT_DYNAMIC|MAC80211|CFG80211)" .config || true
          make -j$(nproc) vmlinux modules
          cd $W
          git clone --depth 1 -b backport https://github.com/hmtheboy154/mt7902
          cd mt7902
          make KSRC=$W/linux-$KVER KVER=$KVER
          mkdir -p $W/pack/modules $W/pack/firmware/mediatek
          cp *.ko $W/pack/modules/
          cp firmware/*.bin $W/pack/firmware/mediatek/
          modprobe --dump-modversions $W/pack/modules/mt7902e.ko | sort > $W/pack/crcs.txt || true
          cd $W && tar cf mt7902-pack.tar -C pack .
          echo "=== RESULTADO ==="; tar tf mt7902-pack.tar
          for f in pack/modules/*.ko; do echo "$f"; modinfo -F vermagic $f; modinfo -F depends $f; done
          mkdir -p $GITHUB_WORKSPACE/out && cp mt7902-pack.tar $GITHUB_WORKSPACE/out/
      - uses: actions/upload-artifact@v4
        with:
          name: mt7902-pack
          path: out/mt7902-pack.tar
